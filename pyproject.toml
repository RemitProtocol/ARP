[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-remittance-protocol"
version = "0.1.0"
description = "A non-custodial, consent-enforced execution layer for AI agents routing cross-border stablecoin-to-fiat transactions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "The Agent Remittance Protocol Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastapi",
    "pydantic>=2.0",
    "mcp",
    "mcp-fastmcp",
    "uvicorn",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black"
]
slack = [
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["arp", "arp.mcp", "arp.policy", "arp.state"]
zip-safe = false

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
